[project]
name = "fastreq"
version = "3.0.0"
description = "High-performance async HTTP client built on niquests and httpx"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Volker Lorrmann", email = "volker.lorrmann@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "niquests>=3.12.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
httpx = ["httpx>=0.28.0"]
h2 = ["h2>=4.0.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "h2>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
lint = [
    "ruff>=0.8.0",
]
typecheck = [
    "ty>=0.0.1a7",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.25.0",
    "mkdocstrings-python>=1.10.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fastreq"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fastreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ty]
python-version = "3.14"

[tool.ty.environment]
python-version = "3.14"
